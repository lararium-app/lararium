# Prefer pulling a published image? See README → "Docker pull (recommended)".
# hearthd in Docker — see docker/config/lararium.yaml (config) and
# docker/hearth/ (persona home: SOUL.md, IDENTITY.md, USER.md, MEMORY.md,
# sessions/). API keys come from the host environment or keys.json; nothing secret
# is baked into the image.
#
#   # talk to a model server on your own machine (llama.cpp et al):
#   docker compose up --build
#   # ...or one-time interactive setup for hosted keys (OpenRouter, Nova, Custom):
#   docker compose exec -it hearthd hearthd setup
#
# Starts the web chat + API on http://127.0.0.1:7717; open a door with:
#   docker compose exec hearthd hearthd token create me
# Prefer the terminal?  docker compose exec -it hearthd hearthd
services:
  hearthd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # M8 hardening: the daemon runs unprivileged, with every capability
    # dropped, no setuid escalation, and a read-only rootfs. The two bind
    # mounts are its only writable ground; they must be owned by the run
    # user — one-time `sudo chown -R "$(id -u):$(id -g)" config hearth`,
    # or pin the uid: LARARIUM_UID=1001 docker compose up.
    user: "${LARARIUM_UID:-1000}:${LARARIUM_UID:-1000}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # The image entrypoint owns startup: it seeds first-run state, runs the
    # wizard when a TTY is attached and no provider is configured, and on a
    # detached start prints guidance instead of hanging. Setup and REPL are
    # explicit subcommands (the entrypoint passes arguments through):
    #   docker compose run --rm -it hearthd setup
    #   docker compose exec -it hearthd hearthd
    stdin_open: true
    # Web chat + API (`hearthd serve`). Published on the host's loopback
    # only — reach it from the machine running Docker, or put your own
    # TLS proxy in front and add its hostname to serve.allowed_hosts.
    # Note: inside the container the daemon binds 0.0.0.0 and logs
    # "WARNING: listening beyond loopback" at startup — expected in
    # containerized mode; host exposure stays loopback-only per this map.
    ports:
      - "127.0.0.1:7717:7717"
    environment:
      # Provider keys: whatever your lararium.yaml references via
      # api_key_env. Uncomment what you use (add more freely — a
      # provider with no key in the environment simply stays unused).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOVITA_API_KEY: ${NOVITA_API_KEY:-}
      LARARIUM_CONFIG: /etc/lararium/lararium.yaml
      LARARIUM_DOCKER: "1"
    # Lets the container reach a model server on the host
    # (http://host.docker.internal:PORT); harmless where it is built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/etc/lararium
      # Bind (not named volume): persona files are required at startup and
      # an empty volume would shadow them; the bind keeps them editable and
      # persistent (sessions/ JSONL lands here too).
      - ./hearth:/hearth
