name: Deploy site

# Publishes the static site/ folder to Cloudflare Pages (lararium.io).
# Direct-upload deploy via wrangler; the Pages project itself stays a
# direct-upload project, so no Cloudflare<->GitHub OAuth grant is needed.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit),
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          npx --yes wrangler@4 pages deploy site \
            --project-name=lararium \
            --branch=main \
            --commit-dirty=true
