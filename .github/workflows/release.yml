# Publishes multi-arch container images on version tags (issue #49).
# Always pushes to GHCR; pushes to Docker Hub only when the two Docker Hub
# secrets are configured on the repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # docker/setup-qemu-action v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hearthd"
          TAGS="${GHCR}:${TAG}"
          # Prerelease tags (containing '-') never move :latest.
          case "$TAG" in
            *-*) : ;;
            *) TAGS="${TAGS},${GHCR}:latest" ;;
          esac
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "has_dockerhub=yes" >> "$GITHUB_OUTPUT"
            DH="docker.io/lararium/hearthd"
            TAGS="${TAGS},${DH}:${TAG}"
            case "$TAG" in
              *-*) : ;;
              *) TAGS="${TAGS},${DH}:latest" ;;
            esac
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        # NOTE: `secrets` is NOT a valid context in step-level `if` — gating
        # on it made the whole file fail to parse (every push produced a
        # failing run and no image was ever published). Gate on the step
        # output computed above instead.
        if: steps.tags.outputs.has_dockerhub == 'yes'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Minimal provenance: full attestations have been observed to
          # block multi-registry pushes on GHCR; mode=min keeps SBOM-free
          # attestations off the critical path.
          provenance: mode=min
          sbom: false

