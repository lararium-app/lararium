# Publishes multi-arch container images on version tags (issue #49).
# Always pushes to GHCR; pushes to Docker Hub only when the two Docker Hub
# secrets are configured on the repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # docker/setup-qemu-action v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # docker/login-action v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hearthd"
          TAGS="${GHCR}:${TAG}"
          # Prerelease tags (containing '-') never move :latest.
          case "$TAG" in
            *-*) : ;;
            *) TAGS="${TAGS},${GHCR}:latest" ;;
          esac
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "has_dockerhub=yes" >> "$GITHUB_OUTPUT"
            DH="docker.io/lararium/hearthd"
            TAGS="${TAGS},${DH}:${TAG}"
            case "$TAG" in
              *-*) : ;;
              *) TAGS="${TAGS},${DH}:latest" ;;
            esac
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        # NOTE: `secrets` is NOT a valid context in step-level `if` — gating
        # on it made the whole file fail to parse (every push produced a
        # failing run and no image was ever published). Gate on the step
        # output computed above instead.
        if: steps.tags.outputs.has_dockerhub == 'yes'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # docker/login-action v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Minimal provenance: full attestations have been observed to
          # block multi-registry pushes on GHCR; mode=min keeps SBOM-free
          # attestations off the critical path.
          provenance: mode=min
          sbom: false

