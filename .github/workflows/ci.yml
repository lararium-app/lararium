name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # builds and tests never embed runner-local paths.
  GOFLAGS: -trimpath

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
          - runs-on: ubuntu-24.04-arm # hardware-agnostic gate: x86_64 + ARM64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI (embed.go requires web/dist to exist)
        run: |
          cd web
          npm ci
          npm run build

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofumpt
        env:
          GOTOOLCHAIN: auto
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"; echo "run: gofumpt -w ."; exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Test
        run: go test -race -p 2 ./...

      - name: Surface V-suite
        run: bash tests/surface/run.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No executables in the tree
        run: |
          # Built binaries belong in bin/ (gitignored). A release cut once
          # swept two 15 MB executables into tracked history — they embed
          # build-host paths, so this gate makes it mechanically hard.
          # (Media assets like .gif/.png are fine; ELF/PE/Mach-O are not.)
          bad=0
          while IFS= read -r -d '' f; do
            magic=$(file -b "$f")
            case "$magic" in
              ELF*|PE32*|Mach-O*)
                echo "executable tracked: $f ($magic)"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then
            echo "remove the files above from git (bin/ is the build output dir)"; exit 1
          fi

      - name: Neutrality scan
        env:
          # Deny-list lives in a repo secret, NOT in this file: a
          # public repo cannot carry the strings it polices. Set it
          # with: gh secret set NEUTRALITY_DENYLIST --repo <repo>
          # (value: one regex, e.g. 'name1|host1|/home/user1').
          DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Product repo: zero personal identifiers, hostnames, home
          # paths, or hardware specifics in tracked files. (grep -I
          # skips binary assets; hits captured by content, not xargs
          # exit code — a partial-match batch exits 123 and must still
          # FAIL the job.) An unset secret means an empty pattern,
          # which matches nothing: the gate stays green but inert, so
          # set the secret in every fork too.
          if [ -z "$DENYLIST" ]; then
            echo "NEUTRALITY_DENYLIST secret not set — scan skipped (inert)"; exit 0
          fi
          hits=$(git ls-files -z | xargs -0 grep -lI -i -E "$DENYLIST" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "personal identifiers found in tracked files (list above)"; exit 1
          fi
          if [ -n "$BASE" ]; then
            msg_hits=0
            while read -r sha; do
              [ -z "$sha" ] && continue
              if git log -1 --format=%B "$sha" | grep -i -q -E "$DENYLIST"; then
                echo "$sha"
                msg_hits=1
              fi
            done < <(git log --format='%H' "$BASE..$HEAD")
            if [ "$msg_hits" -ne 0 ]; then
              echo "personal identifiers found in commit messages"; exit 1
            fi
          fi

      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          regex='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test|security)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          if ! printf '%s\n' "$TITLE" | grep -q -E "$regex"; then
            echo "PR title does not match conventional commits: $TITLE"
            bad=1
          fi
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha="${line%% *}"
            subject="${line#* }"
            if ! printf '%s\n' "$subject" | grep -q -E "$regex"; then
              echo "$line"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

      - name: Secrets scan
        run: |
          bash scripts/scan-secrets.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vt2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: V-T2 exit suite
        run: go test -run 'VT2' ./internal/custos/ -count=1 -v

  device-rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: V-T3 exit suite
        run: go test -run 'VT3' -count=1 ./internal/custos/ -v

  proactivity:
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: V-P proactivity exit suite
        run: bash tests/proactivity/run.sh
