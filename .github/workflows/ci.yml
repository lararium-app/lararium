name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
          - runs-on: ubuntu-24.04-arm # hardware-agnostic gate: x86_64 + ARM64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofumpt
        env:
          GOTOOLCHAIN: auto
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"; echo "run: gofumpt -w ."; exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.14.0

      - name: Test
        run: go test -race ./...

      - name: Surface V-suite
        run: bash tests/surface/run.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No executables in the tree
        run: |
          # Built binaries belong in bin/ (gitignored). A release cut once
          # swept two 15 MB executables into tracked history — they embed
          # build-host paths, so this gate makes it mechanically hard.
          # (Media assets like .gif/.png are fine; ELF/PE/Mach-O are not.)
          bad=0
          while IFS= read -r -d '' f; do
            magic=$(file -b "$f")
            case "$magic" in
              ELF*|PE32*|Mach-O*)
                echo "executable tracked: $f ($magic)"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then
            echo "remove the files above from git (bin/ is the build output dir)"; exit 1
          fi

      - name: Neutrality scan
        env:
          # Deny-list lives in a repo secret, NOT in this file: a
          # public repo cannot carry the strings it polices. Set it
          # with: gh secret set NEUTRALITY_DENYLIST --repo <repo>
          # (value: one regex, e.g. 'name1|host1|/home/user1').
          DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
        run: |
          # Product repo: zero personal identifiers, hostnames, home
          # paths, or hardware specifics in tracked files. (grep -I
          # skips binary assets; hits captured by content, not xargs
          # exit code — a partial-match batch exits 123 and must still
          # FAIL the job.) An unset secret means an empty pattern,
          # which matches nothing: the gate stays green but inert, so
          # set the secret in every fork too.
          if [ -z "$DENYLIST" ]; then
            echo "NEUTRALITY_DENYLIST secret not set — scan skipped (inert)"; exit 0
          fi
          hits=$(git ls-files -z | xargs -0 grep -lI -i -E "$DENYLIST" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "personal identifiers found in tracked files (list above)"; exit 1
          fi

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
