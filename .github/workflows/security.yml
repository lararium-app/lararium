# Security gate for every pull request + weekly deep sweep.
#
# Blocking checks (must be green to merge):
#   secrets    — gitleaks over the full git history (SARIF also uploaded to
#                Security tab); no secret may ever enter this repository.
#   vulncheck  — govulncheck: vulnerabilities in Go modules that the code
#                actually calls.
#   osv        — Open Source Vulnerabilities scan of dependency manifests
#                (go.mod, package-lock.json, pinned actions).
#
# Reporting checks (visible, non-blocking today — promote after backlog):
#   codeql     — CodeQL static analysis, no-build mode (Go).
#
# Third-party actions are pinned to full commit SHAs on purpose.
name: Security

on:
  pull_request:
  schedule:
    - cron: "37 2 * * 1" # Mondays 02:37 UTC — deep sweep on the default branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret in any commit fails the gate

      - name: gitleaks
        # v8.21.2 pinned: verified to detect planted secrets with the full
        # default ruleset (newer 8.30.x silently misses them); the
        # safe.directory config makes history scanning deterministic inside
        # the container.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.21.2 \
            -c "git config --global --add safe.directory /repo && \
                gitleaks git --redact --no-banner --exit-code 1 \
                  -f sarif -r /repo/gitleaks.sarif ."

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: gitleaks.sarif

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          # embed stand-in: //go:embed dist requires web/dist to exist
          mkdir -p web/dist && touch web/dist/index.html
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  osv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          comment: "false"
          args: --recursive --lockfile=go.mod --lockfile=web/package-lock.json .

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          build-mode: none

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:${{ matrix.language }}"
