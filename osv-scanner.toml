# osv-scanner configuration.
#
# No advisories are currently ignored: the lockfile and go.mod scans are
# clean without exceptions. The file stays because CI passes it to every
# scan via --config, and the scanner fails if it is missing.
#
# To record an exception, add an entry with a reason and an expiry so it
# fails the scan once it is due for review, and delete it as soon as the
# dependency is upgraded (the scanner reports ignores that no longer match):
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"  # package version, why it is not reachable
# ignoreUntil = 2027-01-31
# reason = "short justification"
